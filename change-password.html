<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#173f3a" />
    <script src="js/core/page-boot.js"></script>
    <title>เปลี่ยนรหัสผ่าน · จัดหนี้</title>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="apple-touch-icon" href="assets/app-icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script
      type="module"
      blocking="render"
      src="js/core/page-entry.js"
      data-controller="change-password"
    ></script>
  </head>
  <body data-page="dashboard">
    <header class="topbar">
      <a class="brand" href="overview.html"><span class="brand-icon">฿</span> จัดหนี้</a>
      <div class="account-menu">
        <span id="identity" class="small"></span
        ><button
          id="logout"
          class="icon-button logout-button"
          type="button"
          aria-label="ออกจากระบบ"
          title="ออกจากระบบ"
        >
          <svg
            class="ui-icon"
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M8 12h13" />
          </svg>
        </button>
      </div>
    </header>
    <main class="shell">
      <p id="message" role="status"></p>
      <div id="private-content" hidden>
        <nav class="breadcrumbs" aria-label="เส้นทาง">
          <a href="settings.html">ตั้งค่า</a><span aria-current="page">เปลี่ยนรหัสผ่าน</span>
        </nav>
        <section class="page-heading">
          <div>
            <h1>เปลี่ยนรหัสผ่าน</h1>
            <p class="small">ใช้รหัสผ่านปัจจุบันเพื่อยืนยันก่อนเปลี่ยนเป็นรหัสใหม่</p>
          </div>
        </section>
        <section class="card password-settings-card">
          <form id="change-password-form">
            <label for="current-password">รหัสผ่านปัจจุบัน</label
            ><input
              id="current-password"
              type="password"
              autocomplete="current-password"
              required
              maxlength="128"
            />
            <a class="form-link" href="forgot-password.html">จำรหัสผ่านปัจจุบันไม่ได้?</a>
            <label for="new-password">รหัสผ่านใหม่</label
            ><input
              id="new-password"
              type="password"
              autocomplete="new-password"
              required
              minlength="8"
              maxlength="128"
              aria-describedby="new-password-hint"
            />
            <p id="new-password-hint" class="hint">อย่างน้อย 8 ตัวอักษร เลือกรหัสที่ยาวและคาดเดายาก</p>
            <label for="confirm-new-password">ยืนยันรหัสผ่านใหม่</label
            ><input
              id="confirm-new-password"
              type="password"
              autocomplete="new-password"
              required
              minlength="8"
              maxlength="128"
            />
            <div id="password-verification" hidden>
              <label for="password-nonce">รหัสยืนยันทางอีเมล</label
              ><input
                id="password-nonce"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="10"
                pattern="[0-9]{6,10}"
              /><button id="password-send-code" type="button" class="plain-button">
                ส่งรหัสยืนยัน
              </button>
            </div>
            <button type="submit" class="primary" disabled>บันทึกรหัสผ่านใหม่</button>
          </form>
          <p id="password-status" class="notice" role="status" aria-live="polite"></p>
          <div id="password-success" hidden>
            <h2>เปลี่ยนรหัสผ่านแล้ว</h2>
            <p>ใช้รหัสผ่านใหม่ในการเข้าสู่ระบบครั้งถัดไป</p>
          </div>
          <a class="section-link" href="settings.html">กลับหน้าตั้งค่า</a>
        </section>
      </div>
    </main>
    <footer class="footer">จัดหนี้ · บันทึกหนี้ส่วนบุคคล</footer>
  </body>
</html>
