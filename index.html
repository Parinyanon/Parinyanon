<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light" />
    <script src="js/core/page-boot.js"></script>
    <title>รายการหนี้ · จัดหนี้</title>
    <link rel="stylesheet" href="css/app.css" />
    <script
      type="module"
      blocking="render"
      src="js/core/page-entry.js"
      data-controller="debt-list"
    ></script>
    <link rel="apple-touch-icon" href="assets/app-icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#173f3a" />
  </head>
  <body data-page="dashboard" data-debt-list>
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-icon" aria-hidden="true">฿</span> จัดหนี้</a
      >
      <div class="account-menu">
        <span id="identity" class="small"> </span>
        <button
          id="logout"
          class="icon-button logout-button"
          type="button"
          aria-label="ออกจากระบบ"
          title="ออกจากระบบ"
        >
          <svg
            class="ui-icon"
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M9 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M8 12h13" />
          </svg>
        </button>
      </div>
    </header>
    <main class="shell">
      <div id="message" role="status" aria-live="polite">กำลังตรวจสอบเซสชัน…</div>
      <div id="private-content" class="du-main" hidden>
        <header class="du-heading">
          <h1>รายการหนี้</h1>
          <div class="du-heading-actions">
            <a class="du-trash-link plain-button" href="trash.html">ถังขยะ</a>
            <button
              id="refresh"
              class="plain-button du-refresh"
              type="button"
              aria-label="อัปเดตรายการหนี้"
            >
              ↻
            </button>
            <button id="debt-menu" class="du-mobile-menu plain-button" type="button">เมนู</button>
            <a href="create-debt.html" class="du-primary action-button">+ เพิ่มหนี้</a>
          </div>
        </header>
        <section class="du-summary" aria-label="ยอดหนี้ทั้งหมด">
          <div>
            <p class="du-summary-label">ยอดหนี้คงเหลือทั้งหมด · รวมที่ซ่อน</p>
            <div id="debt-total" class="du-money">กำลังโหลด…</div>
          </div>
          <p id="debt-summary-note" class="du-summary-note">ยอดผลค้นหาแสดงเหนือรายการด้านล่าง</p>
        </section>
        <div class="du-tools" role="search">
          <label
            >ค้นหาหนี้<input
              id="search"
              type="search"
              maxlength="150"
              placeholder="ชื่อหนี้หรือเจ้าหนี้"
              disabled
          /></label>
          <label
            >หมวดหมู่<button
              id="category-picker"
              type="button"
              class="du-category-button"
              aria-label="เลือกหมวดหมู่"
              disabled
            >
              <span>ทุกหมวด</span><span aria-hidden="true">⌄</span>
            </button></label
          >
          <label
            >แสดงรายการ<select id="archived" disabled>
              <option value="active">ที่ยังไม่ซ่อน</option>
              <option value="archived">ที่ซ่อนไว้</option>
            </select></label
          >
        </div>
        <div id="debt-status-tools"></div>
        <div id="debt-filter-state" class="du-filter-state" hidden></div>
        <div id="list-status" class="du-load-status" role="status" aria-live="polite">
          กำลังโหลดรายการหนี้…
        </div>
        <div id="debt-results" aria-busy="true"></div>
      </div>
    </main>
    <footer class="footer">จัดหนี้ · ระบบบันทึกหนี้ส่วนบุคคล</footer>
    <noscript>กรุณาเปิด JavaScript เพื่อใช้ระบบ</noscript>
  </body>
</html>
